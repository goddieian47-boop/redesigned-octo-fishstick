          package com.example.airtimeloader

          import android.content.Context

          /** Checks the airtime balance with Safaricom's *144# and remembers the last answer. */
          object Balance {
              private const val CODE = "*144#"
              private val AMOUNT = Regex("""(?i)(?:ksh|kes)\.?\s*([0-9][0-9,]*(?:\.[0-9]+)?)""")

              @Volatile
              var busy = false
                  private set

              class Snapshot(val amount: String?, val reply: String, val time: Long)

              private fun prefs(ctx: Context) = ctx.getSharedPreferences("balance", Context.MODE_PRIVATE)

              fun last(ctx: Context): Snapshot? {
                  val p = prefs(ctx)
                  val t = p.getLong("time", 0L)
                  if (t == 0L) return null
                  return Snapshot(p.getString("amount", null), p.getString("reply", "").orEmpty(), t)
              }

              /** [onDone] gets an error message, or null on success. */
              fun refresh(ctx: Context, onDone: ((String?) -> Unit)? = null) {
                  if (busy) return
                  busy = true
                  val app = ctx.applicationContext
                  Ussd.send(
                      app,
                      CODE,
                      onReply = { raw ->
                          busy = false
                          val reply = raw.replace('\n', ' ').trim()
                          val amount = AMOUNT.find(reply)?.groupValues?.get(1)
                          prefs(app).edit()
                              .putString("amount", amount)
                              .putString("reply", reply.take(200))
                              .putLong("time", System.currentTimeMillis())
                              .apply()
                          Store.log(app, "Balance: " + (if (amount != null) "Ksh $amount" else reply.take(80)))
                          onDone?.invoke(null)
                      },
                      onError = { msg ->
                          busy = false
                          Store.log(app, "Balance check failed: $msg")
                          onDone?.invoke(msg)
                      }
                  )
              }
          }
          EOF_4
          cat > airtime/app/src/main/java/com/example/airtimeloader/DialTab.kt <<'EOF_5'
          package com.example.airtimeloader

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.provider.ContactsContract
          import android.telephony.SmsManager
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          private fun placeCall(ctx: Context, number: String) {
              if (number.isBlank()) return
              val uri = Uri.fromParts("tel", number, null)
              try {
                  if (granted(ctx, Manifest.permission.CALL_PHONE)) {
                      ctx.startActivity(Intent(Intent.ACTION_CALL, uri))
                  } else {
                      ctx.startActivity(Intent(Intent.ACTION_DIAL, uri))
                  }
              } catch (e: Exception) {
                  // no phone app
              }
          }

          /** Sends a text through the phone's SIM. Returns an error message, or null when it was handed to the network. */
          @Suppress("DEPRECATION")
          private fun sendSms(ctx: Context, number: String, text: String): String? {
              return try {
                  val sms: SmsManager? =
                      if (Build.VERSION.SDK_INT >= 31) ctx.getSystemService(SmsManager::class.java) else SmsManager.getDefault()
                  if (sms == null) {
                      "This phone cannot send text messages."
                  } else {
                      sms.sendMultipartTextMessage(number, null, sms.divideMessage(text), null, null)
                      null
                  }
              } catch (e: Exception) {
                  e.message ?: e.javaClass.simpleName
              }
          }

          private fun openMessagesApp(ctx: Context, number: String, text: String) {
              try {
                  ctx.startActivity(
                      Intent(Intent.ACTION_SENDTO, Uri.parse("smsto:" + Uri.encode(number))).putExtra("sms_body", text)
                  )
              } catch (e: Exception) {
                  // no messaging app
              }
          }

          /** Reads the number of a contact picked in the system contacts screen (no contacts permission needed). */
          private fun phoneFrom(ctx: Context, uri: Uri): String? =
              ctx.contentResolver
                  .query(uri, arrayOf(ContactsContract.CommonDataKinds.Phone.NUMBER), null, null, null)
                  ?.use { c -> if (c.moveToFirst()) c.getString(0) else null }
                  ?.filter { it.isDigit() || it == '+' || it == '*' || it == '#' }

          @Composable
          private fun Key(label: String, onClick: () -> Unit) {
              val p = LocalPalette.current
              Box(
                  Modifier
                      .size(72.dp)
                      .clip(CircleShape)
                      .background(p.textLo.copy(alpha = 0.18f))
                      .clickable { onClick() },
                  contentAlignment = Alignment.Center
              ) {
                  Text(label, color = p.textHi, fontSize = 26.sp, fontWeight = FontWeight.Medium)
              }
          }

          @Composable
          fun DialTab() {
              val ctx = LocalContext.current
              val p = LocalPalette.current
              var number by remember { mutableStateOf("") }
              var message by remember { mutableStateOf("") }
              var status by remember { mutableStateOf("") }

              val callLauncher =
                  rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) { ok ->
                      if (ok) placeCall(ctx, number) else status = "Allow the Phone permission to call from here."
                  }
              val smsLauncher =
                  rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) { ok ->
                      status = if (ok) "SMS allowed. Tap Send again." else "Allow the SMS permission to send texts from here."
                  }
              val contactLauncher =
                  rememberLauncherForActivityResult(ActivityResultContracts.StartActivityForResult()) { res ->
                      val uri = res.data?.data
                      if (res.resultCode == Activity.RESULT_OK && uri != null) {
                          val picked = phoneFrom(ctx, uri)
                          if (picked != null) number = picked
                      }
                  }

              TabColumn {
                  Header("Dial", "Call and text from here")

                  Panel {
                      Text(
                          if (number.isEmpty()) "Enter a number" else number,
                          color = if (number.isEmpty()) p.textLo else p.textHi,
                          fontSize = 30.sp,
                          fontWeight = FontWeight.Bold,
                          maxLines = 1,
                          modifier = Modifier.fillMaxWidth()
                      )
                      val rows = listOf(
                          listOf("1", "2", "3"),
                          listOf("4", "5", "6"),
                          listOf("7", "8", "9"),
                          listOf("*", "0", "#")
                      )
                      rows.forEach { row ->
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                              row.forEach { k -> Key(k) { number += k } }
                          }
                      }
                      Row(
                          Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceEvenly,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          GhostButton("Contacts") {
                              try {
                                  contactLauncher.launch(
                                      Intent(Intent.ACTION_PICK, ContactsContract.CommonDataKinds.Phone.CONTENT_URI)
                                  )
                              } catch (e: Exception) {
                                  status = "No contacts app found."
                              }
                          }
                          AccentButton("Call", enabled = number.isNotEmpty()) {
                              if (granted(ctx, Manifest.permission.CALL_PHONE)) {
                                  placeCall(ctx, number)
                              } else {
                                  callLauncher.launch(Manifest.permission.CALL_PHONE)
                              }
                          }
                          GhostButton("⌫") { number = number.dropLast(1) }
                      }
                      if (number.isNotEmpty()) {
                          TextButton(onClick = { number = "" }) { Text("Clear", color = p.textLo) }
                      }
                  }

                  Panel {
                      Title("Text message")
                      OutlinedTextField(
                          value = number,
                          onValueChange = { v -> number = v.filter { it.isDigit() || it == '+' || it == '*' || it == '#' } },
                          label = { Text("To") },
                          singleLine = true,
                          keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Phone),
                          modifier = Modifier.fillMaxWidth()
                      )
                      OutlinedTextField(
                          value = message,
                          onValueChange = { message = it },
                          label = { Text("Message") },
                          minLines = 3,
                          modifier = Modifier.fillMaxWidth()
                      )
                      Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                          AccentButton("Send", enabled = number.isNotEmpty() && message.isNotBlank()) {
                              if (!granted(ctx, Manifest.permission.SEND_SMS)) {
                                  smsLauncher.launch(Manifest.permission.SEND_SMS)
                              } else {
                                  val err = sendSms(ctx, number, message)
                                  status = if (err == null) {
                                      "Message handed to the network for $number. Standard SMS charges apply."
                                  } else {
                                      "Could not send: $err"
                                  }
                                  if (err == null) message = ""
                              }
                          }
                          GhostButton("Open Messages") { openMessagesApp(ctx, number, message) }
                      }
                      Body("This sends texts; it does not show your inbox. Use your Messages app to read replies.")
                      if (status.isNotEmpty()) Body(status)
                  }
              }
          }
          EOF_5
