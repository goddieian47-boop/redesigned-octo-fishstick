          cat > airtime/app/src/main/java/com/example/airtimeloader/PinListenerService.kt <<'EOF_9'
          package com.example.airtimeloader

          import android.Manifest
          import android.app.Notification
          import android.content.ContentUris
          import android.content.pm.PackageManager
          import android.database.ContentObserver
          import android.graphics.Bitmap
          import android.graphics.drawable.BitmapDrawable
          import android.graphics.drawable.Icon
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.provider.MediaStore
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import androidx.core.content.ContextCompat
          import com.google.mlkit.vision.common.InputImage
          import java.util.concurrent.Executors

          /**
           * Reads WhatsApp notifications that mention SOURCE_WORD and hands any 16-digit airtime PIN to
           * the Redeemer. PINs are found in the notification text, in a picture attached to the
           * notification, and in WhatsApp photos that land in the gallery within PHOTO_WINDOW_MS of such a post.
           * The app has no INTERNET permission, so nothing leaves the phone.
           */
          class PinListenerService : NotificationListenerService() {

              private companion object {
                  // ---- tweak these ----
                  const val SOURCE_WORD = "safaricom"         // must appear in the notification; "" = any WhatsApp notification
                  const val PHOTO_WINDOW_MS = 90_000L         // how long after a Safaricom post new photos are read
                  const val MEDIA_BUCKET_WORD = "whatsapp"    // gallery folder name must contain this

                  val WHATSAPP = setOf("com.whatsapp", "com.whatsapp.w4b")
              }

              private val main = Handler(Looper.getMainLooper())
              private val io = Executors.newSingleThreadExecutor()
              private val seenImages = HashSet<Long>()
              private var photoWindowUntil = 0L

              private val mediaObserver = object : ContentObserver(main) {
                  override fun onChange(selfChange: Boolean, uri: Uri?) {
                      if (System.currentTimeMillis() <= photoWindowUntil) scanRecentImages()
                  }
              }

              override fun onListenerConnected() {
                  contentResolver.unregisterContentObserver(mediaObserver)
                  contentResolver.registerContentObserver(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, true, mediaObserver)
              }

              override fun onListenerDisconnected() {
                  contentResolver.unregisterContentObserver(mediaObserver)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  contentResolver.unregisterContentObserver(mediaObserver)
                  io.shutdown()
              }

              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  if (sbn.packageName !in WHATSAPP) return
                  val extras = sbn.notification.extras
                  val text = listOfNotNull(
                      extras.getCharSequence(Notification.EXTRA_TITLE),
                      extras.getCharSequence(Notification.EXTRA_TEXT),
                      extras.getCharSequence(Notification.EXTRA_BIG_TEXT),
                      extras.getCharSequenceArray(Notification.EXTRA_TEXT_LINES)?.joinToString("\n")
                  ).joinToString("\n")
                  if (!text.contains(SOURCE_WORD, ignoreCase = true)) return

                  photoWindowUntil = System.currentTimeMillis() + PHOTO_WINDOW_MS
                  val textPins = Pins.fromText(text)
                  val picture = notificationPicture(sbn.notification)
                  Store.log(this, "Safaricom post: ${textPins.size} PIN(s) in text, picture in notification: ${picture != null}")
                  Redeemer.enqueue(this, textPins)
                  if (picture != null) readImage(InputImage.fromBitmap(picture, 0), "Notification")
              }

              @Suppress("DEPRECATION")
              private fun notificationPicture(n: Notification): Bitmap? {
                  val extras = n.extras
                  extras.getParcelable<Bitmap>(Notification.EXTRA_PICTURE)?.let { return it }
                  if (Build.VERSION.SDK_INT >= 31) {
                      val icon = extras.getParcelable<Icon>(Notification.EXTRA_PICTURE_ICON)
                      val drawable = try { icon?.loadDrawable(this) } catch (e: Exception) { null }
                      (drawable as? BitmapDrawable)?.bitmap?.let { return it }
                  }
                  return null
              }

              /** Called when a new image appears in the gallery shortly after a Safaricom post. */
              private fun scanRecentImages() {
                  val perm = if (Build.VERSION.SDK_INT >= 33) {
                      Manifest.permission.READ_MEDIA_IMAGES
                  } else {
                      Manifest.permission.READ_EXTERNAL_STORAGE
                  }
                  if (ContextCompat.checkSelfPermission(this, perm) != PackageManager.PERMISSION_GRANTED) {
                      Store.log(this, "New photo seen but photo access is not granted")
                      return
                  }

                  val since = System.currentTimeMillis() / 1000 - 120
                  val found = ArrayList<Pair<Long, String>>()
                  try {
                      contentResolver.query(
                          MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                          arrayOf(MediaStore.Images.Media._ID, MediaStore.Images.Media.BUCKET_DISPLAY_NAME),
                          "${MediaStore.Images.Media.DATE_ADDED} >= ?",
                          arrayOf(since.toString()),
                          "${MediaStore.Images.Media.DATE_ADDED} DESC"
                      )?.use { c ->
                          while (c.moveToNext()) {
                              found.add(c.getLong(0) to (c.getString(1) ?: ""))
                          }
                      }
                  } catch (e: Exception) {
                      Store.log(this, "Could not list photos: ${e.javaClass.simpleName}")
                      return
                  }

                  for ((id, bucket) in found) {
                      if (!seenImages.add(id)) continue
                      if (!bucket.contains(MEDIA_BUCKET_WORD, ignoreCase = true)) {
                          Store.log(this, "Photo in \"$bucket\" skipped (not a WhatsApp folder)")
                          continue
                      }
                      val uri = ContentUris.withAppendedId(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, id)
                      io.execute {
                          try {
                              readImage(InputImage.fromFilePath(this, uri), "WhatsApp")
                          } catch (e: Exception) {
                              main.post { Store.log(this, "Could not open photo: ${e.javaClass.simpleName}") }
                          }
                      }
                  }
              }

              private fun readImage(image: InputImage, label: String) {
                  Ocr.pinsIn(image) { pins, err ->
                      if (err != null) {
                          Store.log(this, "$label photo: reading failed (${err.javaClass.simpleName})")
                      } else {
                          Store.log(this, "$label photo: ${pins.size} PIN(s) read")
                          Redeemer.enqueue(this, pins)
                      }
                  }
              }
          }
