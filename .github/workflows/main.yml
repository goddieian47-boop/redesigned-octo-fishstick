          package com.example.airtimeloader

          import android.Manifest
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import androidx.core.app.NotificationManagerCompat
          import androidx.core.content.ContextCompat

          /** Status notifications: PIN found (quiet) and the final result (heads-up). */
          object Alerts {
              private const val PROGRESS_CHANNEL = "progress"
              private const val RESULT_CHANNEL = "results"
              private const val ID = 1001

              /** Quiet update, e.g. "PIN found, redeeming". */
              fun progress(ctx: Context, title: String, text: String) = post(ctx, title, text, loud = false)

              /** Final outcome, shown as a heads-up alert. */
              fun finish(ctx: Context, title: String, text: String) = post(ctx, title, text, loud = true)

              private fun post(ctx: Context, title: String, text: String, loud: Boolean) {
                  val app = ctx.applicationContext
                  try {
                      if (Build.VERSION.SDK_INT >= 33 &&
                          ContextCompat.checkSelfPermission(app, Manifest.permission.POST_NOTIFICATIONS) !=
                          PackageManager.PERMISSION_GRANTED
                      ) return
                      val compat = NotificationManagerCompat.from(app)
                      if (!compat.areNotificationsEnabled()) return

                      val manager = app.getSystemService(NotificationManager::class.java) ?: return
                      manager.createNotificationChannel(
                          NotificationChannel(PROGRESS_CHANNEL, "Voucher progress", NotificationManager.IMPORTANCE_LOW)
                      )
                      manager.createNotificationChannel(
                          NotificationChannel(RESULT_CHANNEL, "Voucher results", NotificationManager.IMPORTANCE_HIGH)
                      )

                      val open = PendingIntent.getActivity(
                          app,
                          0,
                          Intent(app, MainActivity::class.java)
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP),
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      )
                      val builder = NotificationCompat.Builder(app, if (loud) RESULT_CHANNEL else PROGRESS_CHANNEL)
                          .setSmallIcon(R.drawable.ic_stat_airtime)
                          .setColor(0xFF10B981.toInt())
                          .setContentTitle(title)
                          .setContentText(text)
                          .setStyle(NotificationCompat.BigTextStyle().bigText(text))
                          .setContentIntent(open)
                          .setAutoCancel(true)
                          .setCategory(NotificationCompat.CATEGORY_STATUS)
                          .setPriority(if (loud) NotificationCompat.PRIORITY_HIGH else NotificationCompat.PRIORITY_LOW)
                      if (!loud) builder.setTimeoutAfter(60_000L)
                      compat.notify(ID, builder.build())
                  } catch (e: SecurityException) {
                      // notifications not allowed; nothing to do
                  }
              }
          }
