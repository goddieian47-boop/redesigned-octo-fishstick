                              "Bluetooth transfer, so the other device needs no app."
                      )
                      AccentButton("Choose files") { picker.launch(arrayOf("*/*")) }
                      if (picked.isNotEmpty()) {
                          Body(
                              picked.take(5).joinToString("\n") { "• " + fileName(ctx, it) } +
                                  (if (picked.size > 5) "\n…and ${picked.size - 5} more" else "")
                          )
                          AccentButton("Send ${picked.size} file(s) via Bluetooth") { sendViaBluetooth(ctx, picked) }
                      }
                  }

                  Panel {
                      Title("Receive files")
                      Body(
                          "Turn Bluetooth on, open Bluetooth settings and keep that screen open so other devices can find " +
                              "this phone. Accept the incoming file prompt; received files land in your Downloads or " +
                              "Bluetooth folder."
                      )
                  }
