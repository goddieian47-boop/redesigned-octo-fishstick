          package com.example.airtimeloader

          import android.content.Context
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.net.wifi.WifiManager
          import java.io.IOException
          import java.net.ConnectException
          import java.net.HttpURLConnection
          import java.net.Inet4Address
          import java.net.InetAddress
          import java.net.InetSocketAddress
          import java.net.Socket
          import java.net.URL
          import java.util.Random
          import java.util.concurrent.Callable
          import java.util.concurrent.ExecutorService
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.concurrent.atomic.AtomicInteger
          import java.util.concurrent.atomic.AtomicLong
          import kotlin.math.abs

          class WifiSnapshot(
              val onWifi: Boolean,
              val online: Boolean,
              val ssid: String?,
              val linkMbps: Int,
              val signalDbm: Int,
              val ip: String?,
              val gateway: String?
          )

          data class SpeedState(
              val phase: String,
              val ping: Double? = null,
              val jitter: Double? = null,
              val down: Double? = null,
              val up: Double? = null,
              val error: String? = null
          )

          class LanDevice(val ip: String, val name: String?, val note: String)

          /** Wi-Fi information, a speed test against Cloudflare's public test servers, and a scan of the local network. */
          object NetTools {
              private const val DOWN = "https://speed.cloudflare.com/__down?bytes="
              private const val UP = "https://speed.cloudflare.com/__up"
              private val PORTS = intArrayOf(80, 443, 53, 445, 8080, 62078)

              @Suppress("DEPRECATION")
              fun wifiSnapshot(ctx: Context): WifiSnapshot {
                  val app = ctx.applicationContext
                  val cm = app.getSystemService(ConnectivityManager::class.java)
                      ?: return WifiSnapshot(false, false, null, -1, -127, null, null)
                  val net = cm.activeNetwork
                  val caps = if (net != null) cm.getNetworkCapabilities(net) else null
                  val props = if (net != null) cm.getLinkProperties(net) else null
                  val onWifi = caps?.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) == true
                  val online = caps?.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET) == true

                  var ip: String? = null
                  var gateway: String? = null
                  if (props != null) {
                      for (la in props.linkAddresses) {
                          val a = la.address
                          if (a is Inet4Address) { ip = a.hostAddress; break }
                      }
                      for (r in props.routes) {
                          val g = r.gateway
                          if (r.isDefaultRoute && g is Inet4Address) { gateway = g.hostAddress; break }
                      }
                  }
                  val info = if (onWifi) app.getSystemService(WifiManager::class.java)?.connectionInfo else null
                  val ssid = info?.ssid?.trim('"')?.takeIf { it.isNotBlank() && !it.contains("unknown ssid") }
                  return WifiSnapshot(onWifi, online, ssid, info?.linkSpeed ?: -1, info?.rssi ?: -127, ip, gateway)
              }

              private fun http(url: String, timeoutMs: Int): HttpURLConnection {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = timeoutMs
                  c.readTimeout = timeoutMs
                  c.useCaches = false
                  c.setRequestProperty("Cache-Control", "no-cache")
                  return c
              }

              /** Runs on the calling (background) thread and reports progress through [onUpdate]. */
              fun runSpeedTest(cancel: AtomicBoolean, onUpdate: (SpeedState) -> Unit) {
                  var ping: Double? = null
                  var jitter: Double? = null
                  var down: Double? = null
                  var up: Double? = null
                  fun push(phase: String, liveDown: Double? = null, liveUp: Double? = null, error: String? = null) {
                      onUpdate(SpeedState(phase, ping, jitter, liveDown ?: down, liveUp ?: up, error))
                  }

                  try {
                      push("Measuring latency…")
                      val samples = ArrayList<Double>()
                      for (i in 0 until 7) {
                          if (cancel.get()) { push("Stopped"); return }
                          val t0 = System.nanoTime()
                          val c = http(DOWN + "0", 6000)
                          try {
                              c.inputStream.use { it.readBytes() }
                          } finally {
                              c.disconnect()
                          }
                          samples.add((System.nanoTime() - t0) / 1e6)
                      }
                      val s = if (samples.size > 2) samples.drop(1) else samples
                      ping = s.minOrNull()
                      var diff = 0.0
                      for (i in 1 until s.size) diff += abs(s[i] - s[i - 1])
                      jitter = if (s.size > 1) diff / (s.size - 1) else 0.0

                      push("Testing download…")
                      val d = measure(false, cancel, 8, 120_000_000L) { mbps -> push("Testing download…", liveDown = mbps) }
                      if (cancel.get()) { push("Stopped"); return }
                      if (d <= 0.0) throw IOException("Could not download from the test server")
                      down = d

                      push("Testing upload…")
                      val u = measure(true, cancel, 6, 60_000_000L) { mbps -> push("Testing upload…", liveUp = mbps) }
                      if (cancel.get()) { push("Stopped"); return }
                      up = if (u > 0.0) u else null

                      push("Done")
                  } catch (e: Exception) {
                      push("Test failed", error = e.message ?: e.javaClass.simpleName)
                  }
              }

              /** Several parallel streams for [seconds] seconds; returns the average Mbps. */
              private fun measure(
                  upload: Boolean,
                  cancel: AtomicBoolean,
                  seconds: Int,
                  capBytes: Long,
                  onTick: (Double) -> Unit
              ): Double {
                  val total = AtomicLong(0)
                  val start = System.nanoTime()
                  val deadline = start + seconds * 1_000_000_000L
                  val pool = Executors.newFixedThreadPool(3)
                  repeat(3) {
                      pool.execute {
                          try {
                              if (upload) uploadLoop(total, cancel, deadline, capBytes)
                              else downloadLoop(total, cancel, deadline, capBytes)
                          } catch (e: Exception) {
                              // one stream failing is fine
                          }
                      }
                  }
                  pool.shutdown()

                  var lastBytes = 0L
                  var lastTime = start
                  while (!pool.isTerminated && !cancel.get()) {
                      Thread.sleep(300)
                      val now = System.nanoTime()
                      val bytes = total.get()
                      val dt = (now - lastTime) / 1e9
                      if (dt > 0) onTick((bytes - lastBytes) * 8.0 / dt / 1e6)
                      lastBytes = bytes
                      lastTime = now
                  }
                  pool.awaitTermination(3, TimeUnit.SECONDS)
                  val secs = (System.nanoTime() - start) / 1e9
                  return if (secs > 0) total.get() * 8.0 / secs / 1e6 else 0.0
              }

              private fun downloadLoop(total: AtomicLong, cancel: AtomicBoolean, deadline: Long, cap: Long) {
                  val buf = ByteArray(64 * 1024)
                  while (!cancel.get() && System.nanoTime() < deadline && total.get() < cap) {
                      val c = http(DOWN + "25000000", 8000)
                      try {
                          c.inputStream.use { ins ->
                              while (!cancel.get() && System.nanoTime() < deadline && total.get() < cap) {
                                  val n = ins.read(buf)
                                  if (n < 0) break
                                  total.addAndGet(n.toLong())
                              }
                          }
                      } finally {
                          c.disconnect()
                      }
                  }
              }

              private fun uploadLoop(total: AtomicLong, cancel: AtomicBoolean, deadline: Long, cap: Long) {
                  val chunk = ByteArray(64 * 1024)
                  Random().nextBytes(chunk)
                  val perRequest = 1_500_000
                  while (!cancel.get() && System.nanoTime() < deadline && total.get() < cap) {
                      val c = http(UP, 8000)
                      try {
                          c.requestMethod = "POST"
                          c.doOutput = true
                          c.setFixedLengthStreamingMode(perRequest)
                          c.setRequestProperty("Content-Type", "application/octet-stream")
                          c.outputStream.use { out ->
                              var sent = 0
                              while (sent < perRequest && !cancel.get()) {
                                  val n = minOf(chunk.size, perRequest - sent)
                                  out.write(chunk, 0, n)
                                  sent += n
                                  total.addAndGet(n.toLong())
                              }
                          }
                          if (c.responseCode >= 400) throw IOException("Upload server answered ${c.responseCode}")
                      } finally {
                          c.disconnect()
                      }
                  }
              }

              /**
               * Looks for devices on the Wi-Fi network (the /24 around this phone's address). A device counts as
               * present if it answers a ping or any of a few TCP ports (even with "refused"). Blocks until done.
               */
              fun scanLan(
                  ctx: Context,
                  cancel: AtomicBoolean,
                  onProgress: (Int, Int) -> Unit,
                  onFound: (LanDevice) -> Unit
              ) {
                  val snap = wifiSnapshot(ctx)
                  val myIp = snap.ip ?: throw IOException("Not connected to Wi-Fi")
                  if (!snap.onWifi) throw IOException("Not connected to Wi-Fi")
                  val parts = myIp.split(".")
                  if (parts.size != 4) throw IOException("Unexpected IP address")
                  val prefix = parts.take(3).joinToString(".")
                  val hosts = (1..254).map { "$prefix.$it" }

                  val pool = Executors.newFixedThreadPool(48)
                  val dns = Executors.newCachedThreadPool()
                  val done = AtomicInteger(0)
                  for (ip in hosts) {
                      pool.execute {
                          try {
                              if (!cancel.get()) {
                                  val device = probe(ip, myIp, snap.gateway, dns)
                                  if (device != null) onFound(device)
                              }
                          } catch (e: Exception) {
                              // skip this address
                          }
                          onProgress(done.incrementAndGet(), hosts.size)
                      }
                  }
                  pool.shutdown()
                  pool.awaitTermination(90, TimeUnit.SECONDS)
                  dns.shutdownNow()
              }

              private fun probe(ip: String, myIp: String, gateway: String?, dns: ExecutorService): LanDevice? {
                  val addr = InetAddress.getByName(ip)
                  var alive = ip == myIp
                  if (!alive && addr.isReachable(250)) alive = true
                  val openPorts = ArrayList<Int>()
                  for (port in PORTS) {
                      val s = Socket()
                      try {
                          s.connect(InetSocketAddress(addr, port), 220)
                          alive = true
                          openPorts.add(port)
                      } catch (e: ConnectException) {
                          // "connection refused" still proves a device is there
                          if (e.message?.contains("refused", ignoreCase = true) == true) alive = true
                      } catch (e: IOException) {
                          // timed out or unreachable: nothing answered on this port
                      } finally {
                          try { s.close() } catch (e: IOException) { }
                      }
                  }
                  if (!alive && ip != gateway) return null

                  var name: String? = null
                  val lookup = dns.submit(Callable { addr.canonicalHostName })
                  try {
                      val n = lookup.get(1200, TimeUnit.MILLISECONDS)
                      if (n != null && n != ip) name = n
                  } catch (e: Exception) {
                      lookup.cancel(true)
                  }

                  val notes = ArrayList<String>()
                  if (ip == myIp) notes.add("This phone")
                  if (ip == gateway) notes.add("Router")
                  if (80 in openPorts || 443 in openPorts || 8080 in openPorts) notes.add("Web page")
                  if (53 in openPorts) notes.add("DNS")
                  if (445 in openPorts) notes.add("File sharing")
                  if (62078 in openPorts) notes.add("Likely an iPhone or iPad")
                  if (notes.isEmpty()) notes.add("Device")
                  return LanDevice(ip, name, notes.joinToString(" · "))
              }
          }
