          package com.example.airtimeloader

          import android.Manifest
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.util.Size
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.SystemBarStyle
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.camera.core.Camera
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.ImageAnalysis
          import androidx.camera.core.ImageProxy
          import androidx.camera.core.Preview
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.core.content.ContextCompat
          import com.google.mlkit.vision.barcode.BarcodeScannerOptions
          import com.google.mlkit.vision.barcode.BarcodeScanning
          import com.google.mlkit.vision.barcode.common.Barcode
          import com.google.mlkit.vision.common.InputImage
          import java.util.concurrent.Executors

          sealed class ScanResult {
              class Card(val pin: String) : ScanResult()
              class Code(val text: String, val format: String) : ScanResult()
          }

          /** Live camera scanner: reads scratch-card PINs (text recognition) or QR codes and barcodes. */
          class ScannerActivity : ComponentActivity() {

              companion object {
                  const val EXTRA_MODE = "mode"
                  const val MODE_CARD = 0
                  const val MODE_CODE = 1
              }

              private val analysisExecutor = Executors.newSingleThreadExecutor()
              private val barcodeScanner = BarcodeScanning.getClient(
                  BarcodeScannerOptions.Builder().setBarcodeFormats(Barcode.FORMAT_ALL_FORMATS).build()
              )
              private var camera: Camera? = null

              private var mode by mutableIntStateOf(MODE_CARD)
              private var result by mutableStateOf<ScanResult?>(null)
              private var torch by mutableStateOf(false)

              @Volatile
              private var currentMode = MODE_CARD

              @Volatile
              private var holding = false   // a result is on screen: pause analysis

              private var candidate: String? = null
              private var hits = 0
              private var misses = 0

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge(
                      statusBarStyle = SystemBarStyle.dark(android.graphics.Color.TRANSPARENT),
                      navigationBarStyle = SystemBarStyle.dark(android.graphics.Color.TRANSPARENT)
                  )
                  setMode(intent.getIntExtra(EXTRA_MODE, MODE_CARD))
                  setContent { ScannerScreen() }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  analysisExecutor.shutdown()
                  barcodeScanner.close()
              }

              private fun setMode(m: Int) {
                  currentMode = m
                  mode = m
                  rescan()
              }

              private fun rescan() {
                  result = null
                  holding = false
                  candidate = null
                  hits = 0
                  misses = 0
              }

              private fun toggleTorch() {
                  torch = !torch
                  camera?.cameraControl?.enableTorch(torch)
              }

              private fun startCamera(view: PreviewView) {
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      val provider = future.get()
                      val preview = Preview.Builder().build()
                      preview.setSurfaceProvider(view.surfaceProvider)
                      val analysis = ImageAnalysis.Builder()
                          .setTargetResolution(Size(1080, 1920))
                          .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                          .build()
                      analysis.setAnalyzer(analysisExecutor) { proxy -> analyze(proxy) }
                      provider.unbindAll()
                      camera = provider.bindToLifecycle(this, CameraSelector.DEFAULT_BACK_CAMERA, preview, analysis)
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun analyze(proxy: ImageProxy) {
                  val media = proxy.image
                  if (media == null || holding) {
                      proxy.close()
                      return
                  }
                  val image = InputImage.fromMediaImage(media, proxy.imageInfo.rotationDegrees)
                  if (currentMode == MODE_CARD) {
                      Ocr.process(image)
                          .addOnSuccessListener { t -> onText(t) }
                          .addOnCompleteListener { proxy.close() }
                  } else {
                      barcodeScanner.process(image)
                          .addOnSuccessListener { list -> onBarcodes(list) }
                          .addOnCompleteListener { proxy.close() }
                  }
              }

              /** A PIN must be read in two frames in a row before it is offered, to avoid misreads. */
              private fun onText(text: com.google.mlkit.vision.text.Text) {
                  if (holding || currentMode != MODE_CARD) return
                  val pin = text.textBlocks
                      .flatMap { it.lines }
                      .flatMap { Pins.fromOcrLine(it.text) }
                      .firstOrNull()
                  if (pin == null) {
                      misses++
                      if (misses > 6) {
                          candidate = null
                          hits = 0
                      }
                      return
                  }
                  misses = 0
                  if (pin == candidate) {
                      hits++
                  } else {
                      candidate = pin
                      hits = 1
                  }
                  if (hits >= 2) {
                      holding = true
                      result = ScanResult.Card(pin)
                      candidate = null
                      hits = 0
                  }
              }

              private fun onBarcodes(list: List<Barcode>) {
                  if (holding || currentMode != MODE_CODE) return
                  val b = list.firstOrNull { !it.rawValue.isNullOrEmpty() } ?: return
                  holding = true
                  result = ScanResult.Code(b.rawValue.orEmpty(), formatName(b.format))
              }

              private fun formatName(format: Int): String = when (format) {
                  Barcode.FORMAT_QR_CODE -> "QR code"
                  Barcode.FORMAT_EAN_13 -> "EAN-13 barcode"
                  Barcode.FORMAT_EAN_8 -> "EAN-8 barcode"
                  Barcode.FORMAT_UPC_A -> "UPC-A barcode"
                  Barcode.FORMAT_UPC_E -> "UPC-E barcode"
                  Barcode.FORMAT_CODE_128 -> "Code 128 barcode"
                  Barcode.FORMAT_CODE_39 -> "Code 39 barcode"
                  Barcode.FORMAT_PDF417 -> "PDF417 code"
                  Barcode.FORMAT_AZTEC -> "Aztec code"
                  Barcode.FORMAT_DATA_MATRIX -> "Data Matrix code"
                  else -> "Barcode"
              }

              private fun loadAirtime(pin: String) {
                  Redeemer.enqueue(this, listOf(pin))
                  Toast.makeText(this, "Loading airtime…", Toast.LENGTH_SHORT).show()
                  finish()
              }

              private fun copyText(t: String) {
                  getSystemService(ClipboardManager::class.java)?.setPrimaryClip(ClipData.newPlainText("Scan", t))
                  Toast.makeText(this, "Copied", Toast.LENGTH_SHORT).show()
              }

              private fun openLink(t: String) {
                  try {
                      startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(t)))
                  } catch (e: Exception) {
                      Toast.makeText(this, "No app can open this", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun shareText(t: String) {
                  val send = Intent(Intent.ACTION_SEND).setType("text/plain").putExtra(Intent.EXTRA_TEXT, t)
                  startActivity(Intent.createChooser(send, null))
              }

              @Composable
              private fun ScannerScreen() {
                  val ctx = LocalContext.current
                  val pal = remember { PALETTES[Look.theme(ctx)] }
                  var permitted by remember {
                      mutableStateOf(
                          ContextCompat.checkSelfPermission(ctx, Manifest.permission.CAMERA) ==
                              PackageManager.PERMISSION_GRANTED
                      )
                  }
                  val launcher =
                      rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) { ok -> permitted = ok }
                  LaunchedEffect(Unit) {
                      if (!permitted) launcher.launch(Manifest.permission.CAMERA)
                  }

                  Box(Modifier.fillMaxSize().background(Color.Black)) {
                      if (permitted) {
                          AndroidView(
                              modifier = Modifier.fillMaxSize(),
                              factory = { c -> PreviewView(c).also { startCamera(it) } }
                          )
                      } else {
                          Text(
                              "Camera permission is needed to scan.",
                              color = Color.White,
                              modifier = Modifier.align(Alignment.Center).padding(24.dp)
                          )
                      }

                      Column(
                          Modifier.fillMaxWidth().statusBarsPadding().padding(16.dp),
                          verticalArrangement = Arrangement.spacedBy(12.dp)
                      ) {
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              Chip("Scratch card", mode == MODE_CARD, pal) { setMode(MODE_CARD) }
                              Chip("QR / barcode", mode == MODE_CODE, pal) { setMode(MODE_CODE) }
                              Chip(if (torch) "Light on" else "Light", torch, pal) { toggleTorch() }
                          }
                          Text(
                              if (mode == MODE_CARD) "Scratch off the coating, then hold the PIN inside the frame."
                              else "Point the camera at a QR code or barcode.",
                              color = Color.White,
                              fontSize = 14.sp
                          )
                      }

                      Box(
                          Modifier
                              .align(Alignment.Center)
                              .fillMaxWidth(0.86f)
                              .height(if (mode == MODE_CARD) 120.dp else 260.dp)
                              .border(2.dp, Color.White.copy(alpha = 0.85f), RoundedCornerShape(18.dp))
                      )

                      val r = result
                      if (r != null) {
                          ResultSheet(r, pal, Modifier.align(Alignment.BottomCenter))
                      }
                  }
              }

              @Composable
