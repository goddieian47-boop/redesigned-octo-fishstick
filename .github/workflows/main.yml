          package com.example.airtimeloader

          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          /** Scrollable page that leaves room for the status bar. */
          @Composable
          fun TabColumn(content: @Composable () -> Unit) {
              Column(
                  Modifier
                      .fillMaxSize()
                      .statusBarsPadding()
                      .verticalScroll(rememberScrollState())
                      .padding(horizontal = 20.dp, vertical = 16.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) { content() }
          }

          @Composable
          fun Header(title: String, subtitle: String) {
              val p = LocalPalette.current
              Column {
                  Text(title, color = p.textHi, fontSize = 28.sp, fontWeight = FontWeight.Bold)
                  Text(subtitle, color = p.textLo, fontSize = 14.sp)
              }
          }

          @Composable
          fun Panel(content: @Composable () -> Unit) {
              val p = LocalPalette.current
              Surface(shape = RoundedCornerShape(22.dp), color = p.card, modifier = Modifier.fillMaxWidth()) {
                  Column(Modifier.padding(18.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) { content() }
              }
          }

          @Composable
          fun Title(text: String) {
              val p = LocalPalette.current
              Text(text, color = p.textHi, fontSize = 16.sp, fontWeight = FontWeight.SemiBold)
          }

          @Composable
          fun Body(text: String, mono: Boolean = false) {
              val p = LocalPalette.current
              Text(
                  text,
                  color = p.textLo,
                  fontSize = if (mono) 12.sp else 13.sp,
                  fontFamily = if (mono) FontFamily.Monospace else FontFamily.Default
              )
          }

          @Composable
          fun AccentButton(label: String, enabled: Boolean = true, onClick: () -> Unit) {
              val p = LocalPalette.current
              Button(
                  onClick = onClick,
                  enabled = enabled,
                  shape = RoundedCornerShape(14.dp),
                  colors = ButtonDefaults.buttonColors(containerColor = p.accent, contentColor = p.onAccent)
              ) { Text(label, fontWeight = FontWeight.SemiBold) }
          }

          @Composable
          fun GhostButton(label: String, onClick: () -> Unit) {
              val p = LocalPalette.current
              OutlinedButton(onClick = onClick, shape = RoundedCornerShape(14.dp)) { Text(label, color = p.accent) }
          }

          @Composable
          fun Stat(label: String, value: String, modifier: Modifier = Modifier) {
              val p = LocalPalette.current
              Column(modifier, horizontalAlignment = Alignment.CenterHorizontally) {
                  Text(value, color = p.accent, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                  Text(label, color = p.textLo, fontSize = 12.sp)
              }
          }
