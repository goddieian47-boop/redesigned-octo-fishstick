          cat > airtime/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF_15'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
              <monochrome android:drawable="@drawable/ic_launcher_monochrome" />
          </adaptive-icon>
          EOF_15
          cat > airtime/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF_16'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
              <monochrome android:drawable="@drawable/ic_launcher_monochrome" />
          </adaptive-icon>
          EOF_16
          cat > airtime/app/src/main/res/values/strings.xml <<'EOF_17'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="screen_reader_description">Reads the screen only when you double-press Volume Up. It looks for 16-digit airtime PINs and ignores everything else. Nothing is stored or sent anywhere, and the app has no internet access.</string>
          </resources>
          EOF_17
          cat > airtime/app/src/main/res/xml/accessibility_config.xml <<'EOF_18'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents|flagIncludeNotImportantViews"
              android:canRequestFilterKeyEvents="true"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:description="@string/screen_reader_description"
              android:notificationTimeout="100" />
          EOF_18
          cat > airtime/build.gradle.kts <<'EOF_19'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_19
          cat > airtime/gradle.properties <<'EOF_20'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3072m
          kotlin.code.style=official
          EOF_20
          cat > airtime/settings.gradle.kts <<'EOF_21'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AirtimeLoader"
          include(":app")
          EOF_21

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: airtime
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: airtime-loader-apk
          path: airtime/app/build/outputs/apk/debug/app-debug.apk
