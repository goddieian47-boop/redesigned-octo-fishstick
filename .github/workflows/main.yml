          package com.example.airtimeloader

          import android.graphics.Bitmap
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions

          /** On-device text recognition that returns any 16-digit PINs found in an image. */
          object Ocr {
              private val recognizer by lazy { TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS) }

              /** Loads the text model ahead of time so the first real scan is fast. */
              fun warmUp() {
                  val blank = Bitmap.createBitmap(32, 32, Bitmap.Config.ARGB_8888)
                  recognizer.process(InputImage.fromBitmap(blank, 0))
              }

              /** Calls [onDone] on the main thread with the PINs read, or with an error. */
              fun pinsIn(image: InputImage, onDone: (List<String>, Exception?) -> Unit) {
                  recognizer.process(image)
                      .addOnSuccessListener { result ->
                          val pins = result.textBlocks
                              .flatMap { it.lines }
                              .flatMap { Pins.fromOcrLine(it.text) }
                              .distinct()
                          onDone(pins, null)
                      }
                      .addOnFailureListener { e -> onDone(emptyList(), e) }
              }
          }
          EOF_5
