# Airtime Loader v2.0 - one-file build.
# Adds: airtime balance, clock, themes and wallpapers, scratch-card and QR/barcode scanner,
# Wi-Fi speed test and network scan, Bluetooth file sharing, phone dialer and texting.
# This workflow writes the whole Android project, compiles it, and uploads app-debug.apk.
name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write project files
        run: |
          set -e
          mkdir -p airtime
          mkdir -p airtime/app
          mkdir -p airtime/app/src/main
          mkdir -p airtime/app/src/main/java/com/example/airtimeloader
          mkdir -p airtime/app/src/main/res/drawable
          mkdir -p airtime/app/src/main/res/mipmap-anydpi-v26
          mkdir -p airtime/app/src/main/res/values
          mkdir -p airtime/app/src/main/res/xml
          cat > airtime/app/build.gradle.kts <<'EOF_1'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.airtimeloader"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.airtimeloader"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 7
                  versionName = "2.0"
                  ndk {
                      abiFilters += listOf("arm64-v8a", "armeabi-v7a")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              // On-device text recognition (model is bundled, no internet needed at runtime)
              implementation("com.google.mlkit:text-recognition:16.0.1")
              implementation("com.google.mlkit:barcode-scanning:17.3.0")
              // Camera for the scratch-card and QR scanner
              implementation("androidx.camera:camera-core:1.3.4")
              implementation("androidx.camera:camera-camera2:1.3.4")
              implementation("androidx.camera:camera-lifecycle:1.3.4")
              implementation("androidx.camera:camera-view:1.3.4")
          }
          EOF_1
