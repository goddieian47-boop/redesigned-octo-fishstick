          package com.example.airtimeloader

          import android.Manifest
          import android.content.Context
          import android.content.pm.PackageManager
          import android.os.Handler
          import android.os.Looper
          import android.telephony.TelephonyManager
          import androidx.core.content.ContextCompat

          /** Redeems PINs one at a time with the Safaricom top-up code *141*PIN#. Shared by every PIN source. */
          object Redeemer {
              // ---- tweak these ----
              private const val MAX_FAILED_PINS = 3               // stop after this many rejected PINs in one run
              private const val STOP_AFTER_FIRST_SUCCESS = true   // false = keep going and use every valid PIN

              // Words in Safaricom's reply that mean "PIN rejected" / "airtime loaded". These are guesses:
              // check the in-app log and adjust them to the real reply texts.
              private val REJECTED = Regex(
                  "invalid|incorrect|not correct|wrong|already|been used|expired|not valid|exceeded|blocked|unable|fail|error|try again",
                  RegexOption.IGNORE_CASE
              )
              private val CONFIRMED = Regex(
                  "success|recharged|topped|top-up|top up|credited|loaded|received|new balance|airtime balance",
                  RegexOption.IGNORE_CASE
              )

              private val main = Handler(Looper.getMainLooper())
              private val queue = ArrayDeque<String>()
              private var current: String? = null
              private var failures = 0
              private var accepted = false
              private var confirmed = false
              private var lastReply = ""

              /** Queues PINs not tried before and starts redeeming. Returns how many were new. */
              fun enqueue(ctx: Context, pins: List<String>): Int {
                  if (Looper.myLooper() != Looper.getMainLooper()) {
                      main.post { enqueue(ctx, pins) }
                      return 0
                  }
                  val app = ctx.applicationContext
                  val fresh = pins.distinct()
                      .filter { !Store.wasTried(app, it) && it != current && it !in queue }
                  if (fresh.isEmpty()) return 0
                  queue.addAll(fresh)
                  Alerts.progress(app, "Voucher found", "${fresh.size} new PIN(s) detected. Redeeming…")
                  if (current == null) {
                      failures = 0
                      accepted = false
                      confirmed = false
                      lastReply = ""
                      redeemNext(app)
                  }
                  return fresh.size
              }

              private fun redeemNext(ctx: Context) {
                  val pin = queue.removeFirstOrNull()
                  if (pin == null) { finishRun(ctx, null); return }
                  current = pin
                  val tag = "…" + pin.takeLast(4)   // PINs are masked in the log

                  val allowed = ContextCompat.checkSelfPermission(ctx, Manifest.permission.CALL_PHONE) ==
                      PackageManager.PERMISSION_GRANTED
                  if (!allowed) {
                      Store.log(ctx, "$tag skipped: phone permission not granted")
                      finishRun(ctx, "Phone permission is not granted. Open the app and tap Allow on Phone.")
                      return
                  }
                  val tm = ctx.getSystemService(TelephonyManager::class.java)
                  if (tm == null) { finishRun(ctx, "This device cannot send USSD requests."); return }

                  try {
                      tm.sendUssdRequest("*141*$pin#", object : TelephonyManager.UssdResponseCallback() {
                          override fun onReceiveUssdResponse(t: TelephonyManager, request: String, response: CharSequence) {
                              val reply = response.toString().replace('\n', ' ').trim()
                              Store.markTried(ctx, pin)
                              Store.log(ctx, "$tag: " + reply.take(110))
                              lastReply = reply.take(160)
                              val rejected = REJECTED.containsMatchIn(reply)
                              if (rejected) {
                                  failures++
                              } else {
                                  accepted = true
                                  if (CONFIRMED.containsMatchIn(reply)) confirmed = true
                              }
                              val done = (!rejected && STOP_AFTER_FIRST_SUCCESS) || failures >= MAX_FAILED_PINS
                              if (done) {
                                  finishRun(ctx, null)
                              } else {
                                  Alerts.progress(ctx, "PIN $tag rejected", "Trying the next one…")
                                  redeemNext(ctx)
                              }
                          }

                          override fun onReceiveUssdResponseFailed(t: TelephonyManager, request: String, failureCode: Int) {
                              Store.log(ctx, "$tag: USSD error $failureCode")
                              finishRun(ctx, "Could not send the PIN (USSD error $failureCode). Safaricom may be busy.")
                          }
                      }, main)
                  } catch (e: Exception) {
                      Store.log(ctx, "$tag: ${e.javaClass.simpleName}")
                      finishRun(ctx, "Could not send the PIN (${e.javaClass.simpleName}).")
                  }
              }

              /** Ends the run and tells the user how it went. */
              private fun finishRun(ctx: Context, error: String?) {
                  val (title, text) = when {
                      error != null -> "Could not redeem PIN" to error
                      confirmed -> "Airtime loaded ✓" to lastReply
                      accepted -> "PIN accepted" to "Safaricom replied: $lastReply. Check your balance."
                      else -> "No PIN worked" to "$failures rejected. Last reply: $lastReply"
                  }
                  queue.clear()
                  current = null
                  Alerts.finish(ctx, title, text)
              }
          }
