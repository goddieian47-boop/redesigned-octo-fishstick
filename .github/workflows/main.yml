              val hint: String,
              val done: Boolean,
              val action: String,
              val onClick: () -> Unit
          )

          fun granted(ctx: Context, perm: String): Boolean =
              ContextCompat.checkSelfPermission(ctx, perm) == PackageManager.PERMISSION_GRANTED

          private fun accessibilityOn(ctx: Context): Boolean {
              val enabled = Settings.Secure.getString(
                  ctx.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
              ) ?: return false
              return enabled.contains("${ctx.packageName}/") && enabled.contains("ScreenReaderService")
          }

          private fun batteryOk(ctx: Context): Boolean =
              ctx.getSystemService(PowerManager::class.java)?.isIgnoringBatteryOptimizations(ctx.packageName) == true

          private fun openAppNotificationSettings(ctx: Context) {
              try {
                  ctx.startActivity(
                      Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS)
                          .putExtra(Settings.EXTRA_APP_PACKAGE, ctx.packageName)
                  )
              } catch (e: Exception) {
                  // no settings screen available
              }
          }

          /** Reads PINs from a chosen photo and shows them. Nothing is dialed. */
          private fun testScan(ctx: Context, uri: Uri, onResult: (String) -> Unit) {
              val main = Handler(Looper.getMainLooper())
              onResult("Reading photo…")
              Thread {
                  try {
                      val image = InputImage.fromFilePath(ctx, uri)
                      Ocr.pinsIn(image) { pins, err ->
                          onResult(
                              when {
                                  err != null -> "Reading failed: ${err.message}"
                                  pins.isEmpty() -> "No 16-digit PINs found in that photo."
                                  else -> "Found ${pins.size} PIN(s), test only (nothing dialed):\n" +
                                      pins.joinToString("\n") { Pins.pretty(it) }
                              }
                          )
                      }
                  } catch (e: Exception) {
                      main.post { onResult("Could not open that photo: ${e.message}") }
                  }
              }.start()
          }

          @Composable
          fun HomeTab(tick: Int, refresh: () -> Unit) {
              val ctx = LocalContext.current
              val p = LocalPalette.current

              val notifOn = remember(tick) {
                  NotificationManagerCompat.getEnabledListenerPackages(ctx).contains(ctx.packageName)
              }
              val phoneOn = remember(tick) { granted(ctx, Manifest.permission.CALL_PHONE) }
              val a11yOn = remember(tick) { accessibilityOn(ctx) }
              val photoOn = remember(tick) { granted(ctx, PHOTO_PERMISSION) }
              val batteryOn = remember(tick) { batteryOk(ctx) }
