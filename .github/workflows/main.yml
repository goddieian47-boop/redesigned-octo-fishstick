          cat > airtime/app/src/main/java/com/example/airtimeloader/Ussd.kt <<'EOF_20'
          package com.example.airtimeloader

          import android.Manifest
          import android.content.Context
          import android.content.pm.PackageManager
          import android.os.Handler
          import android.os.Looper
          import android.telephony.TelephonyManager
          import androidx.core.content.ContextCompat

          /** Sends USSD codes one at a time (Android allows one session), each with a timeout. */
          object Ussd {
              private class Job(
                  val code: String,
                  val onReply: (String) -> Unit,
                  val onError: (String) -> Unit
              )

              private const val TIMEOUT_MS = 25_000L
              private val main = Handler(Looper.getMainLooper())
              private val jobs = ArrayDeque<Job>()
              private var running: Job? = null
              private var app: Context? = null

              fun send(ctx: Context, code: String, onReply: (String) -> Unit, onError: (String) -> Unit) {
                  if (Looper.myLooper() != Looper.getMainLooper()) {
                      main.post { send(ctx, code, onReply, onError) }
                      return
                  }
                  app = ctx.applicationContext
                  jobs.addLast(Job(code, onReply, onError))
                  pump()
              }

              private fun pump() {
                  if (running != null) return
                  val ctx = app ?: return
                  val job = jobs.removeFirstOrNull() ?: return
                  running = job

                  val allowed = ContextCompat.checkSelfPermission(ctx, Manifest.permission.CALL_PHONE) ==
                      PackageManager.PERMISSION_GRANTED
                  if (!allowed) {
                      complete(job, null, "Phone permission is not granted")
                      return
                  }
                  val tm = ctx.getSystemService(TelephonyManager::class.java)
                  if (tm == null) {
                      complete(job, null, "This device cannot send USSD requests")
                      return
                  }

                  main.postDelayed({ complete(job, null, "No reply from the network (timed out)") }, TIMEOUT_MS)
                  try {
                      tm.sendUssdRequest(job.code, object : TelephonyManager.UssdResponseCallback() {
                          override fun onReceiveUssdResponse(t: TelephonyManager, request: String, response: CharSequence) {
                              complete(job, response.toString(), null)
                          }

                          override fun onReceiveUssdResponseFailed(t: TelephonyManager, request: String, failureCode: Int) {
                              complete(job, null, "USSD error $failureCode")
                          }
                      }, main)
                  } catch (e: Exception) {
                      complete(job, null, e.javaClass.simpleName)
                  }
              }

              /** Finishes [job] once; a late reply after a timeout is ignored. */
              private fun complete(job: Job, reply: String?, error: String?) {
                  if (running !== job) return
                  running = null
                  if (reply != null) job.onReply(reply) else job.onError(error ?: "unknown error")
                  pump()
              }
          }
