                      fontWeight = FontWeight.SemiBold,
                      modifier = Modifier.padding(horizontal = 14.dp, vertical = 8.dp)
                  )
              }
          }

          @Composable
          private fun Btn(label: String, pal: Palette, primary: Boolean, onClick: () -> Unit) {
              if (primary) {
                  Button(
                      onClick = onClick,
                      colors = ButtonDefaults.buttonColors(containerColor = pal.accent, contentColor = pal.onAccent)
                  ) { Text(label, fontWeight = FontWeight.SemiBold) }
              } else {
                  OutlinedButton(onClick = onClick) { Text(label, color = pal.accent) }
              }
          }
