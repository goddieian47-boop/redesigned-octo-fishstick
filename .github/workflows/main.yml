# Airtime Loader v1.5 - one-file build (new phone-with-plus app icon).
# This workflow writes the whole Android project, compiles it, and uploads app-debug.apk.
name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write project files
        run: |
          set -e
          mkdir -p airtime
          mkdir -p airtime/app
          mkdir -p airtime/app/src/main
          mkdir -p airtime/app/src/main/java/com/example/airtimeloader
          mkdir -p airtime/app/src/main/res/drawable
          mkdir -p airtime/app/src/main/res/mipmap-anydpi-v26
          mkdir -p airtime/app/src/main/res/values
          mkdir -p airtime/app/src/main/res/xml
          cat > airtime/app/build.gradle.kts <<'EOF_1'
