          package com.example.airtimeloader

          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          @Composable
          fun LookTab(
              themeIdx: Int,
              wallIdx: Int,
              hasCustom: Boolean,
              onTheme: (Int) -> Unit,
              onWall: (Int) -> Unit,
              onCustomSaved: () -> Unit
          ) {
              val ctx = LocalContext.current
              val p = LocalPalette.current
              var message by remember { mutableStateOf("") }
              val picker = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                  if (uri != null) {
                      message = "Saving wallpaper…"
                      Look.saveCustom(ctx, uri) { ok ->
                          message = if (ok) "Wallpaper set." else "Could not use that photo."
                          if (ok) onCustomSaved()
                      }
                  }
              }

              TabColumn {
                  Header("Look", "Colours and wallpapers")

                  Panel {
                      Title("Theme")
                      Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(16.dp)) {
                          PALETTES.forEachIndexed { i, pal ->
                              Column(
                                  horizontalAlignment = Alignment.CenterHorizontally,
                                  modifier = Modifier.clickable { onTheme(i) }
                              ) {
                                  Box(
                                      Modifier
                                          .size(52.dp)
                                          .clip(CircleShape)
                                          .background(Brush.linearGradient(listOf(pal.heroA, pal.accent)))
                                          .border(if (i == themeIdx) 3.dp else 0.dp, p.textHi, CircleShape)
                                  )
                                  Text(
                                      pal.name,
                                      color = if (i == themeIdx) p.textHi else p.textLo,
                                      fontSize = 12.sp,
                                      modifier = Modifier.padding(top = 6.dp)
                                  )
                              }
                          }
                      }
                  }

                  Panel {
                      Title("Wallpaper")
                      Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          WALLPAPERS.forEachIndexed { i, w ->
                              val colors = w.colors.ifEmpty { listOf(p.bgTop, p.bgBottom) }
                              Box(
                                  Modifier
                                      .size(width = 72.dp, height = 104.dp)
                                      .clip(RoundedCornerShape(14.dp))
                                      .background(Brush.linearGradient(colors))
                                      .border(if (i == wallIdx) 3.dp else 0.dp, p.textHi, RoundedCornerShape(14.dp))
                                      .clickable { onWall(i) },
                                  contentAlignment = Alignment.BottomCenter
                              ) {
                                  Text(w.name, color = Color.White, fontSize = 11.sp, modifier = Modifier.padding(6.dp))
                              }
                          }
                          if (hasCustom) {
                              Box(
                                  Modifier
                                      .size(width = 72.dp, height = 104.dp)
                                      .clip(RoundedCornerShape(14.dp))
                                      .background(p.textLo.copy(alpha = 0.35f))
                                      .border(if (wallIdx == CUSTOM_WALL) 3.dp else 0.dp, p.textHi, RoundedCornerShape(14.dp))
                                      .clickable { onWall(CUSTOM_WALL) },
                                  contentAlignment = Alignment.BottomCenter
                              ) {
                                  Text("My photo", color = Color.White, fontSize = 11.sp, modifier = Modifier.padding(6.dp))
                              }
                          }
                      }
                      GhostButton("Choose a photo") { picker.launch("image/*") }
                      if (message.isNotEmpty()) Body(message)
                  }

                  Panel {
                      Title("About and privacy")
