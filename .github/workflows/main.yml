          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.app.NotificationManagerCompat
          import androidx.core.content.ContextCompat
          import com.google.mlkit.vision.common.InputImage
          import kotlinx.coroutines.delay

          private val Ink = Color(0xFF0A1018)
          private val Deep = Color(0xFF0E2A2B)
          private val CardBg = Color(0xFF151F2E)
          private val Accent = Color(0xFF34D399)
          private val OnAccent = Color(0xFF04120C)
          private val Warn = Color(0xFFF5B83D)
          private val TextHi = Color(0xFFF1F5F9)
          private val TextLo = Color(0xFF93A3B8)

          private val PHOTO_PERMISSION =
              if (Build.VERSION.SDK_INT >= 33) Manifest.permission.READ_MEDIA_IMAGES
              else Manifest.permission.READ_EXTERNAL_STORAGE

          private class Check(
              val title: String,
              val hint: String,
              val done: Boolean,
              val action: String,
              val onClick: () -> Unit
          )

          class MainActivity : ComponentActivity() {

              private var tick by mutableIntStateOf(0)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge(
                      statusBarStyle = SystemBarStyle.dark(android.graphics.Color.TRANSPARENT),
                      navigationBarStyle = SystemBarStyle.dark(android.graphics.Color.TRANSPARENT)
                  )
                  setContent {
                      MaterialTheme(
                          colorScheme = darkColorScheme(
                              primary = Accent,
                              onPrimary = OnAccent,
                              background = Ink,
                              surface = CardBg
                          )
                      ) {
                          Screen(tick) { tick++ }
                      }
                  }
              }

              override fun onResume() {
                  super.onResume()
                  tick++
              }
          }

          private fun granted(ctx: Context, perm: String): Boolean =
              ContextCompat.checkSelfPermission(ctx, perm) == PackageManager.PERMISSION_GRANTED

          private fun accessibilityOn(ctx: Context): Boolean {
              val enabled = Settings.Secure.getString(
                  ctx.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
              ) ?: return false
              return enabled.contains("${ctx.packageName}/") && enabled.contains("ScreenReaderService")
          }

          private fun batteryOk(ctx: Context): Boolean =
              ctx.getSystemService(PowerManager::class.java)?.isIgnoringBatteryOptimizations(ctx.packageName) == true

          /** Reads PINs from a chosen photo and shows them. Nothing is dialed. */
          private fun testScan(ctx: Context, uri: Uri, onResult: (String) -> Unit) {
              val main = Handler(Looper.getMainLooper())
              onResult("Reading photo…")
              Thread {
                  try {
                      val image = InputImage.fromFilePath(ctx, uri)
                      Ocr.pinsIn(image) { pins, err ->
                          onResult(
                              when {
                                  err != null -> "Reading failed: ${err.message}"
                                  pins.isEmpty() -> "No 16-digit PINs found in that photo."
                                  else -> "Found ${pins.size} PIN(s), test only (nothing dialed):\n" +
                                      pins.joinToString("\n") { Pins.pretty(it) }
                              }
                          )
                      }
                  } catch (e: Exception) {
                      main.post { onResult("Could not open that photo: ${e.message}") }
                  }
              }.start()
          }

          @Composable
          private fun Screen(tick: Int, refresh: () -> Unit) {
              val ctx = LocalContext.current

              val notifOn = remember(tick) {
                  NotificationManagerCompat.getEnabledListenerPackages(ctx).contains(ctx.packageName)
              }
              val phoneOn = remember(tick) { granted(ctx, Manifest.permission.CALL_PHONE) }
              val a11yOn = remember(tick) { accessibilityOn(ctx) }
              val photoOn = remember(tick) { granted(ctx, PHOTO_PERMISSION) }
              val batteryOn = remember(tick) { batteryOk(ctx) }

              var log by remember { mutableStateOf(Store.readLog(ctx)) }
              var testResult by remember { mutableStateOf("") }
              LaunchedEffect(Unit) {
                  while (true) {
                      log = Store.readLog(ctx)
                      delay(1000)
                  }
              }

              val phoneLauncher =
                  rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) { refresh() }
              val photoLauncher =
                  rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) { refresh() }
              val pickLauncher =
                  rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                      if (uri != null) testScan(ctx, uri) { testResult = it }
                  }

              fun open(action: String) {
                  runCatching { ctx.startActivity(Intent(action)) }
              }

              val checks = listOf(
                  Check("Notifications", "Reads Safaricom Care posts in WhatsApp", notifOn, "Enable") {
                      open(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)
                  },
                  Check("Phone", "Lets the app dial *141*PIN# for you", phoneOn, "Allow") {
                      phoneLauncher.launch(Manifest.permission.CALL_PHONE)
                  },
                  Check("Screen reader", "Double-press Volume Up to scan any screen", a11yOn, "Enable") {
                      open(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                  },
                  Check("Photos", "Reads giveaway photos WhatsApp saves (choose Allow all)", photoOn, "Allow") {
                      photoLauncher.launch(PHOTO_PERMISSION)
                  },
                  Check("Background", "Keeps the app awake when the screen is off", batteryOn, "Allow") {
                      runCatching {
                          ctx.startActivity(
                              Intent(
                                  Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                                  Uri.parse("package:${ctx.packageName}")
                              )
                          )
                      }
                  }
              )
              val doneCount = checks.count { it.done }

              Box(
                  Modifier
                      .fillMaxSize()
                      .background(Brush.verticalGradient(listOf(Ink, Deep)))
              ) {
                  Column(
                      Modifier
                          .fillMaxSize()
                          .statusBarsPadding()
                          .navigationBarsPadding()
                          .verticalScroll(rememberScrollState())
                          .padding(horizontal = 20.dp, vertical = 16.dp),
                      verticalArrangement = Arrangement.spacedBy(16.dp)
                  ) {
                      Column {
                          Text("Airtime Loader", color = TextHi, fontSize = 28.sp, fontWeight = FontWeight.Bold)
                          Text(
                              "Catches Safaricom giveaway PINs the moment they appear",
                              color = TextLo,
                              fontSize = 14.sp
                          )
                      }

                      Hero(doneCount, checks.size, notifOn && phoneOn)

                      Panel {
                          Text("Setup", color = TextHi, fontSize = 16.sp, fontWeight = FontWeight.SemiBold)
                          checks.forEach { SetupRow(it) }
                      }

                      Panel {
                          Text("Double-press Volume Up", color = TextHi, fontSize = 16.sp, fontWeight = FontWeight.SemiBold)
                          Spacer(Modifier.height(6.dp))
                          Text(
                              if (a11yOn) {
                                  "On any screen (a chat, a photo, a screenshot) press Volume Up twice quickly. " +
                                      "The app reads everything on screen, finds 16-digit PINs and redeems them."
                              } else {
                                  "Turn on Screen reader above to enable this shortcut."
                              },
                              color = TextLo,
                              fontSize = 13.sp
                          )
                      }

                      Panel {
                          Text("Try it safely", color = TextHi, fontSize = 16.sp, fontWeight = FontWeight.SemiBold)
                          Spacer(Modifier.height(6.dp))
                          Text(
                              "Pick a photo or screenshot to see which PINs the app can read. Nothing is dialed.",
                              color = TextLo,
                              fontSize = 13.sp
                          )
                          Spacer(Modifier.height(12.dp))
                          OutlinedButton(onClick = { pickLauncher.launch("image/*") }) {
                              Text("Scan a photo", color = Accent)
                          }
                          if (testResult.isNotEmpty()) {
                              Spacer(Modifier.height(12.dp))
                              Text(testResult, color = TextHi, fontFamily = FontFamily.Monospace, fontSize = 13.sp)
                          }
                      }

                      Panel {
                          Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                              Text(
                                  "Activity",
                                  color = TextHi,
                                  fontSize = 16.sp,
                                  fontWeight = FontWeight.SemiBold,
                                  modifier = Modifier.weight(1f)
                              )
                              TextButton(onClick = { Store.clearLog(ctx); log = "" }) {
                                  Text("Clear log", color = TextLo, fontSize = 12.sp)
                              }
                              TextButton(onClick = { Store.clear(ctx); log = "" }) {
                                  Text("Reset all", color = TextLo, fontSize = 12.sp)
                              }
                          }
                          Spacer(Modifier.height(6.dp))
                          Text(
                              if (log.isBlank()) "Nothing yet. Safaricom's replies will appear here." else log,
                              color = TextLo,
                              fontFamily = FontFamily.Monospace,
                              fontSize = 12.sp
                          )
                      }

                      TextButton(onClick = {
                          runCatching {
                              ctx.startActivity(
                                  Intent(
                                      Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                                      Uri.fromParts("package", ctx.packageName, null)
                                  )
                              )
                          }
                      }) {
                          Text(
                              "Setting greyed out? Open app info, then the three-dot menu, then Allow restricted settings",
                              color = TextLo,
                              fontSize = 12.sp
                          )
                      }
                  }
              }
          }

          @Composable
          private fun Hero(done: Int, total: Int, ready: Boolean) {
              Box(
                  Modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(24.dp))
                      .background(Brush.linearGradient(listOf(Color(0xFF0F766E), Color(0xFF065F46))))
                      .padding(20.dp)
              ) {
                  Column {
                      Text(
                          if (ready) "Ready for the next giveaway" else "Finish setup to get started",
                          color = Color.White,
                          fontSize = 20.sp,
                          fontWeight = FontWeight.SemiBold
                      )
                      Spacer(Modifier.height(6.dp))
                      Text("$done of $total steps complete", color = Color(0xFFCFF7E8), fontSize = 13.sp)
                      Spacer(Modifier.height(14.dp))
                      Box(
                          Modifier
                              .fillMaxWidth()
                              .height(8.dp)
                              .clip(RoundedCornerShape(4.dp))
                              .background(Color(0x33FFFFFF))
                      ) {
                          Box(
                              Modifier
                                  .fillMaxWidth(done / total.toFloat())
                                  .fillMaxHeight()
                                  .background(Color.White)
                          )
                      }
                  }
              }
          }

          @Composable
          private fun Panel(content: @Composable () -> Unit) {
              Surface(shape = RoundedCornerShape(22.dp), color = CardBg, modifier = Modifier.fillMaxWidth()) {
                  Column(Modifier.padding(18.dp)) { content() }
              }
          }

          @Composable
          private fun SetupRow(c: Check) {
              Row(
                  Modifier
                      .fillMaxWidth()
                      .padding(vertical = 10.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(
                      Modifier
                          .size(28.dp)
                          .clip(CircleShape)
                          .background(if (c.done) Accent else Color(0xFF2A3547)),
                      contentAlignment = Alignment.Center
                  ) {
                      Text(
                          if (c.done) "✓" else "!",
                          color = if (c.done) OnAccent else Warn,
                          fontWeight = FontWeight.Bold
                      )
                  }
                  Spacer(Modifier.width(14.dp))
                  Column(Modifier.weight(1f)) {
                      Text(c.title, color = TextHi, fontWeight = FontWeight.SemiBold)
                      Text(c.hint, color = TextLo, fontSize = 12.sp)
                  }
                  if (!c.done) {
                      TextButton(onClick = c.onClick) { Text(c.action, color = Accent) }
                  }
              }
          }
