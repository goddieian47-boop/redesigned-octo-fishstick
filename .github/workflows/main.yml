          package com.example.airtimeloader

          import android.accessibilityservice.AccessibilityService
          import android.graphics.Bitmap
          import android.media.AudioAttributes
          import android.media.AudioManager
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.os.SystemClock
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.Display
          import android.view.KeyEvent
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Toast
          import androidx.core.content.ContextCompat
          import com.google.mlkit.vision.common.InputImage
          import java.util.concurrent.Executors

          /**
           * Press Volume Up twice quickly on any screen: the app reads the screen (the text on it, plus a
           * screenshot run through on-device text recognition), finds 16-digit airtime PINs and redeems them.
           * Nothing from the screen is stored or sent anywhere; only PIN-shaped numbers are used.
           */
          class ScreenReaderService : AccessibilityService() {

              private companion object {
                  const val DOUBLE_PRESS_MS = 400L
                  const val MIN_SCAN_GAP_MS = 1500L
                  const val SWALLOW_LIMIT_MS = 3000L
              }

              private val main = Handler(Looper.getMainLooper())
              private val io = Executors.newSingleThreadExecutor()
              private val streams = intArrayOf(
                  AudioManager.STREAM_MUSIC, AudioManager.STREAM_RING, AudioManager.STREAM_VOICE_CALL
              )
              private val snapshot = IntArray(3) { -1 }
              private var lastDownTime = -10_000L
              private var swallowing = false
              private var swallowStart = 0L
              private var lastScan = -10_000L

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  Ocr.warmUp()
                  Store.log(this, "Screen reader connected: double-press Volume Up to scan")
              }

              override fun onDestroy() {
                  super.onDestroy()
                  io.shutdown()
              }

              override fun onKeyEvent(event: KeyEvent): Boolean {
                  if (event.keyCode != KeyEvent.KEYCODE_VOLUME_UP) return false

                  // The second press is still held down: swallow it (and its repeats) until it is released.
                  if (swallowing && event.eventTime - swallowStart > SWALLOW_LIMIT_MS) swallowing = false
                  if (swallowing) {
                      if (event.action == KeyEvent.ACTION_UP) swallowing = false
                      return true
                  }
                  if (event.action != KeyEvent.ACTION_DOWN || event.repeatCount > 0) return false

                  val t = event.eventTime   // time of the press itself, not of when we got to handle it
                  if (t - lastDownTime <= DOUBLE_PRESS_MS) {
                      lastDownTime = -10_000L
                      if (getSystemService(PowerManager::class.java)?.isInteractive == false) return false
                      swallowing = true
                      swallowStart = t
                      undoFirstPress()
                      buzz()
                      main.post { scanScreen() }   // keep this callback fast
                      return true
                  }
                  lastDownTime = t
                  rememberVolumes()
                  return false   // the first press behaves normally
              }

              private fun rememberVolumes() {
                  val am = getSystemService(AudioManager::class.java) ?: return
                  for (i in streams.indices) {
                      snapshot[i] = try { am.getStreamVolume(streams[i]) } catch (e: Exception) { -1 }
                  }
              }

              /** The first press already raised the volume; put it back so the shortcut has no side effect. */
              private fun undoFirstPress() {
                  val am = getSystemService(AudioManager::class.java) ?: return
                  for (i in streams.indices) {
                      try {
                          if (snapshot[i] >= 0 && am.getStreamVolume(streams[i]) > snapshot[i]) {
                              am.adjustStreamVolume(streams[i], AudioManager.ADJUST_LOWER, 0)
                          }
                      } catch (e: Exception) {
                          // e.g. Do Not Disturb rules; ignore
                      }
                  }
              }

              @Suppress("DEPRECATION")
              private fun buzz() {
                  try {
                      val vibrator = getSystemService(Vibrator::class.java) ?: return
                      val effect = VibrationEffect.createOneShot(40, VibrationEffect.DEFAULT_AMPLITUDE)
                      val attrs = AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ASSISTANCE_ACCESSIBILITY)
                          .build()
                      vibrator.vibrate(effect, attrs)
                  } catch (e: Exception) {
                      // no vibrator or not allowed; ignore
                  }
              }

              private fun scanScreen() {
                  val now = SystemClock.uptimeMillis()
                  if (now - lastScan < MIN_SCAN_GAP_MS) return
                  lastScan = now

                  val scan = Scan()
                  captureScreen(scan, 1)
                  io.execute {
                      val pins = pinsFromTree()
                      main.post { scan.treeDone(pins) }
                  }
              }

              /** Joins the two halves of a scan (on-screen text, screenshot) and reports once both are in. */
              private inner class Scan {
                  private var tree: List<String>? = null
                  private var image: List<String>? = null
                  private var note: String? = null
                  private var queued = 0

                  fun treeDone(pins: List<String>) {
                      tree = pins
                      queued += Redeemer.enqueue(this@ScreenReaderService, pins)
                      finishIfReady()
                  }

                  fun imageDone(pins: List<String>, why: String?) {
                      image = pins
                      note = why
                      queued += Redeemer.enqueue(this@ScreenReaderService, pins)
                      finishIfReady()
                  }

                  private fun finishIfReady() {
                      val t = tree ?: return
                      val i = image ?: return
                      report(t, i, note, queued)
                  }
              }

              private fun captureScreen(scan: Scan, attempt: Int) {
                  if (Build.VERSION.SDK_INT < 30) {
                      scan.imageDone(emptyList(), "image scan needs Android 11+")
                      return
                  }
                  takeScreenshot(
                      Display.DEFAULT_DISPLAY,
                      ContextCompat.getMainExecutor(this),
                      object : AccessibilityService.TakeScreenshotCallback {
                          override fun onSuccess(screenshot: AccessibilityService.ScreenshotResult) {
                              val bitmap = toSoftwareBitmap(screenshot)
                              if (bitmap == null) {
                                  scan.imageDone(emptyList(), "screenshot could not be read")
                                  return
                              }
                              Ocr.pinsIn(InputImage.fromBitmap(bitmap, 0)) { pins, err ->
                                  scan.imageDone(pins, if (err != null) "text reading failed" else null)
                              }
                          }

                          override fun onFailure(errorCode: Int) {
                              if (errorCode == AccessibilityService.ERROR_TAKE_SCREENSHOT_INTERVAL_TIME_SHORT && attempt < 2) {
                                  main.postDelayed({ captureScreen(scan, attempt + 1) }, 1100L)
                              } else {
                                  scan.imageDone(emptyList(), "screenshot error $errorCode")
                              }
                          }
                      }
                  )
              }

              private fun toSoftwareBitmap(s: AccessibilityService.ScreenshotResult): Bitmap? {
                  val buffer = s.hardwareBuffer
                  return try {
                      Bitmap.wrapHardwareBuffer(buffer, s.colorSpace)?.copy(Bitmap.Config.ARGB_8888, false)
                  } catch (e: Exception) {
                      null
                  } finally {
                      buffer.close()
                  }
              }

              /** Collects every piece of text on the current screen and keeps only PIN-shaped numbers. */
              private fun pinsFromTree(): List<String> {
                  val root = rootInActiveWindow ?: return emptyList()
                  val found = LinkedHashSet<String>()
                  var visited = 0
                  fun walk(node: AccessibilityNodeInfo?, depth: Int) {
                      if (node == null || depth > 80 || visited > 5000) return
                      visited++
                      node.text?.let { found.addAll(Pins.fromText(it.toString())) }
                      node.contentDescription?.let { found.addAll(Pins.fromText(it.toString())) }
                      for (i in 0 until node.childCount) walk(node.getChild(i), depth + 1)
                  }
                  walk(root, 0)
                  return found.toList()
              }

              private fun report(fromTree: List<String>, fromImage: List<String>, note: String?, queued: Int) {
                  val all = (fromTree + fromImage).distinct()
                  Store.log(
                      this,
                      "Screen scan: ${all.size} PIN(s) (text ${fromTree.size}, image ${fromImage.size}, new $queued)" +
                          (if (note != null) " - $note" else "")
                  )
                  when {
                      all.isEmpty() ->
                          Toast.makeText(this, "No PINs found on screen", Toast.LENGTH_SHORT).show()
                      queued == 0 ->
                          Alerts.finish(
                              this,
                              "Nothing new to redeem",
                              "${all.size} PIN(s) on screen were already tried or are being redeemed."
                          )
                  }
              }
          }
