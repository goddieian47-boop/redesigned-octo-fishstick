          package com.example.airtimeloader

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.net.Uri
          import android.os.Handler
          import android.os.Looper
          import androidx.compose.ui.graphics.ImageBitmap
          import androidx.compose.ui.graphics.asImageBitmap
          import java.io.File

          /** Remembers the chosen theme and wallpaper. A photo wallpaper is stored as a small file inside the app. */
          object Look {
              private fun prefs(ctx: Context) = ctx.getSharedPreferences("look", Context.MODE_PRIVATE)
              private fun file(ctx: Context) = File(ctx.filesDir, "wallpaper.jpg")

              fun theme(ctx: Context): Int = prefs(ctx).getInt("theme", 0).coerceIn(0, PALETTES.size - 1)

              fun setTheme(ctx: Context, index: Int) {
                  prefs(ctx).edit().putInt("theme", index).apply()
              }

              fun wallpaper(ctx: Context): Int = prefs(ctx).getInt("wallpaper", 0)

              fun setWallpaper(ctx: Context, index: Int) {
                  prefs(ctx).edit().putInt("wallpaper", index).apply()
              }

              fun version(ctx: Context): Int = prefs(ctx).getInt("wp_version", 0)

              fun hasCustom(ctx: Context): Boolean = file(ctx).exists()

              fun loadCustom(ctx: Context): ImageBitmap? =
                  try {
                      BitmapFactory.decodeFile(file(ctx).path)?.asImageBitmap()
                  } catch (e: Exception) {
                      null
                  }

              /** Shrinks the picked photo, stores it, and calls [onDone] on the main thread. */
              fun saveCustom(ctx: Context, uri: Uri, onDone: (Boolean) -> Unit) {
                  val app = ctx.applicationContext
                  Thread {
                      val ok = try {
                          val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                          app.contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, bounds) }
                          var sample = 1
                          while (maxOf(bounds.outWidth, bounds.outHeight) / sample > 1600) sample *= 2
                          val opts = BitmapFactory.Options().apply { inSampleSize = sample }
                          val bmp = app.contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, opts) }
                          if (bmp == null) {
                              false
                          } else {
                              file(app).outputStream().use { bmp.compress(Bitmap.CompressFormat.JPEG, 85, it) }
                              prefs(app).edit()
                                  .putInt("wp_version", version(app) + 1)
                                  .putInt("wallpaper", CUSTOM_WALL)
                                  .apply()
                              true
                          }
                      } catch (e: Exception) {
                          false
                      }
                      Handler(Looper.getMainLooper()).post { onDone(ok) }
                  }.start()
              }
          }
          EOF_6
