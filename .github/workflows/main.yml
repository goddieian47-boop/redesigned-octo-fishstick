          package com.example.airtimeloader

          /** Finds 16-digit airtime PINs in plain text or in OCR output. */
          object Pins {
              private val PIN = Regex("""(?<!\d)(\d{4})[ \u00A0-]?(\d{4})[ \u00A0-]?(\d{4})[ \u00A0-]?(\d{4})(?!\d)""")

              fun fromText(text: String): List<String> =
                  PIN.findAll(text).map { m -> m.groupValues.drop(1).joinToString("") }.distinct().toList()

              /** OCR often confuses O/0 and I/l/1, so fix those on lines that are mostly digits. */
              fun fromOcrLine(line: String): List<String> {
                  if (line.count { it.isDigit() } < 12) return emptyList()
                  val fixed = line.map { c ->
                      when (c) {
                          'O', 'o' -> '0'
                          'I', 'l', '|' -> '1'
                          else -> c
                      }
                  }.joinToString("")
                  return fromText(fixed)
              }

              fun pretty(pin: String): String = pin.chunked(4).joinToString(" ")
          }
