          private fun fileName(ctx: Context, uri: Uri): String {
              val fromProvider = ctx.contentResolver
                  .query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)
                  ?.use { c -> if (c.moveToFirst()) c.getString(0) else null }
              return fromProvider ?: uri.lastPathSegment ?: "file"
          }

          /** Hands the files to Android's own Bluetooth transfer, so the other device needs no app. */
          private fun sendViaBluetooth(ctx: Context, uris: List<Uri>) {
              if (uris.isEmpty()) return
              val intent = if (uris.size == 1) {
                  Intent(Intent.ACTION_SEND).apply {
                      type = ctx.contentResolver.getType(uris[0]) ?: "*/*"
                      putExtra(Intent.EXTRA_STREAM, uris[0])
                  }
              } else {
                  Intent(Intent.ACTION_SEND_MULTIPLE).apply {
                      type = "*/*"
                      putParcelableArrayListExtra(Intent.EXTRA_STREAM, ArrayList(uris))
                  }
              }
              intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
              val clip = ClipData.newUri(ctx.contentResolver, "files", uris[0])
              for (u in uris.drop(1)) clip.addItem(ClipData.Item(u))
              intent.clipData = clip

              for (pkg in listOf("com.android.bluetooth", "com.google.android.bluetooth")) {
                  try {
                      ctx.startActivity(Intent(intent).setClassName(pkg, "com.android.bluetooth.opp.BluetoothOppLauncherActivity"))
                      return
                  } catch (e: Exception) {
                      // try the next package name
                  }
              }
              try {
                  ctx.startActivity(Intent.createChooser(intent, "Send via Bluetooth"))
              } catch (e: Exception) {
                  // nothing can handle it
              }
          }

